<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Calendário de Presença de Apoio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#1E2A38;
    --ink-2:#28394C;
    --paper:#F3F1EA;
    --card:#FFFFFF;
    --accent:#E0A73A;
    --accent-soft:#F7E6BE;
    --teal:#3F6F62;
    --teal-soft:#DCEAE5;
    --line:#DAD5C7;
    --danger:#B5533C;
    --danger-soft:#F3DCD5;
    --text:#25303D;
    --text-soft:#6E7681;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh;
  }
  /* ---------- Toolbar ---------- */
  header.toolbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--ink);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:3px dashed var(--accent);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand svg{flex-shrink:0;}
  .brand-text h1{ margin:0; font-size:1.25rem; font-weight:700; letter-spacing:0.01em; }
  .brand-text p{ margin:2px 0 0; font-size:.78rem; color:var(--accent-soft); opacity:.85; }
  .toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .field-inline{display:flex; align-items:center; gap:6px;}
  .field-inline label{font-size:.72rem; color:var(--accent-soft); opacity:.9;}
  select, input[type="number"]{
    font-family:'IBM Plex Mono', monospace;
    background:var(--ink-2);
    color:#fff;
    border:1px solid rgba(255,255,255,.25);
    border-radius:4px;
    padding:7px 9px;
    font-size:.85rem;
  }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  input[type="number"]{ width:82px; }
  input[type="text"].toolbar-text{ width:230px; }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:.85rem;
    padding:8px 16px;
    border-radius:4px;
    border:1px solid transparent;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ filter:brightness(0.95); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
  .btn-primary{ background:var(--accent); color:var(--ink); }
  .btn-ghost{ background:transparent; color:#fff; border-color:rgba(255,255,255,.35); }
  .btn-ink{ background:var(--ink); color:#fff; }
  .btn-teal{ background:var(--teal); color:#fff; }

  /* ---------- Main ---------- */
  main{ max-width:780px; margin:0 auto; padding:28px 20px 20px; }
  .month-heading{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .month-heading h2{ margin:0; font-size:1.4rem; font-weight:700; color:var(--ink); }
  .month-heading span{ font-family:'IBM Plex Mono', monospace; font-size:.8rem; color:var(--text-soft); }

  .day-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    gap:16px;
  }

  .day-date{ width:52px; flex-shrink:0; text-align:center; padding-top:2px; }
  .day-num{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:1.55rem; color:var(--ink); line-height:1; }
  .day-weekday{ font-family:'IBM Plex Mono', monospace; font-size:.68rem; color:var(--text-soft); margin-top:4px; }

  .day-info{ flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }

  .pessoa-block{
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    background:#FCFBF8;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .pessoa-block + .pessoa-block{ margin-top:2px; }
  .pessoa-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .pessoa-header span{ font-size:.72rem; font-weight:600; color:var(--text-soft); }
  .repetir-label{
    display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--teal);
    cursor:pointer; font-weight:500; user-select:none;
  }
  .repetir-label input[type="checkbox"]{
    width:14px; height:14px; accent-color:var(--teal); cursor:pointer; margin:0;
  }
  .btn-remove-pessoa{
    background:none; border:none; color:var(--danger); font-size:.72rem;
    cursor:pointer; padding:2px 4px; font-weight:600;
  }
  .btn-remove-pessoa:hover{ text-decoration:underline; }

  .field-group label{ display:block; font-size:.74rem; color:var(--text-soft); margin-bottom:4px; }
  .nome-input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:'Space Grotesk', sans-serif; font-size:.9rem; color:var(--text);
  }
  .nome-input:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }

  .btn-add-pessoa{
    align-self:flex-start;
    background:var(--accent-soft);
    color:#7A5A17;
    border:1px dashed var(--accent);
    border-radius:4px;
    padding:7px 12px;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-add-pessoa:hover{ filter:brightness(0.97); }

  footer.status{ text-align:center; font-size:.75rem; color:var(--text-soft); padding:6px 20px 10px; }

  /* ---------- Painel de imagem ---------- */
  .image-panel{
    max-width:780px; margin:10px auto 60px; padding:20px; background:var(--card);
    border:1px solid var(--line); border-radius:8px;
  }
  .image-panel h3{ margin:0 0 4px; font-size:1.1rem; color:var(--ink); }
  .image-panel p.desc{ margin:0 0 16px; font-size:.85rem; color:var(--text-soft); }
  .image-panel-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .image-preview-wrap{ margin-top:18px; }
  .image-preview-wrap img{
    width:100%; height:auto; border:1px solid var(--line); border-radius:6px; display:block;
  }
  .image-status{ font-size:.78rem; color:var(--text-soft); margin-top:8px; }

  /* ---------- Calendário para imagem (fora da tela) ---------- */
  #calendarioImagemHost{ position:absolute; left:-99999px; top:0; width:1200px; }
  .cal-wrap{
    width:1200px; background:var(--paper);
    font-family:'Space Grotesk', system-ui, sans-serif; color:var(--text); padding:32px;
  }
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:#fff; padding:20px 26px; border-radius:8px 8px 0 0;
    border-bottom:4px dashed var(--accent);
  }
  .cal-header h2{ margin:0; font-size:1.7rem; font-weight:700; }
  .cal-header span{ font-family:'IBM Plex Mono', monospace; font-size:.9rem; color:var(--accent-soft); }
  .cal-grid{
    display:grid; grid-template-columns:repeat(4, 1fr);
    border:1px solid var(--line); border-top:none; background:var(--card);
  }
  .cal-weekday{
    background:var(--ink-2); color:#fff; text-align:center; padding:8px 4px;
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; font-weight:600;
  }
  .cal-cell{ border:1px solid var(--line); min-height:90px; padding:8px; display:flex; flex-direction:column; gap:5px; }
  .cal-cell.empty{ background:#EDEAE1; }
  .cal-cell-num{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:1rem; color:var(--ink); }
  .cal-pessoa{
    border-left:3px solid var(--accent); padding:3px 6px; background:var(--accent-soft);
    border-radius:2px; font-size:.76rem; line-height:1.3; font-weight:700; color:#5B4110;
  }
  .cal-footer{
    text-align:right; font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--text-soft);
    padding:8px 6px 0;
  }
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="13" stroke="#E0A73A" stroke-width="2"/>
      <path d="M15 9v6l4 3" stroke="#E0A73A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-text">
      <h1>Presença de apoio</h1>
      <p>Designe quem fica na sala com o professor, dia a dia do seminário</p>
    </div>
  </div>
  <div class="toolbar-actions">
    <div class="field-inline">
      <label for="alaInput">Ala</label>
      <input type="text" id="alaInput" class="toolbar-text" placeholder="Nome da ala">
    </div>
    <div class="field-inline">
      <label for="estacaInput">Estaca</label>
      <input type="text" id="estacaInput" class="toolbar-text" placeholder="Nome da estaca">
    </div>
    <div class="field-inline">
      <label for="mesSelect">Mês</label>
      <select id="mesSelect"></select>
    </div>
    <div class="field-inline">
      <label for="anoInput">Ano</label>
      <input type="number" id="anoInput" min="2000" max="2100" />
    </div>
    <button class="btn btn-ghost" id="btnNovo">Novo</button>
    <button class="btn btn-ghost" id="btnAbrir">Abrir</button>
    <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
  </div>
</header>

<main>
  <div class="month-heading">
    <h2 id="mesAnoTitulo">—</h2>
    <span id="totalDiasLabel"></span>
  </div>
  <div id="diasContainer"></div>
</main>
<footer class="status" id="statusLabel">Escolha o mês e o ano para começar.</footer>

<section class="image-panel">
  <h3>Imagem para compartilhar</h3>
  <p class="desc">Gere um calendário do mês em formato de imagem horizontal, pronto para baixar ou enviar no WhatsApp.</p>
  <div class="image-panel-actions">
    <button class="btn btn-ink" id="btnGerarImagem">Gerar imagem</button>
    <button class="btn btn-teal" id="btnBaixarImagem" disabled>Baixar imagem</button>
    <button class="btn btn-primary" id="btnCompartilharImagem" disabled>Compartilhar no WhatsApp</button>
  </div>
  <div class="image-status" id="imageStatus"></div>
  <div class="image-preview-wrap" id="imagePreviewWrap" style="display:none;">
    <img id="imagePreview" alt="Pré-visualização do calendário de presença de apoio">
  </div>
</section>

<!-- Calendário renderizado fora da tela, usado apenas para gerar a imagem -->
<div id="calendarioImagemHost"></div>

<script>
(function(){
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  // O apoio na sala só é necessário de terça a sexta-feira (getDay(): 2=Ter, 3=Qua, 4=Qui, 5=Sex)
  const DIAS_PERMITIDOS = [2, 3, 4, 5];
  const DIAS_SEMANA_PERMITIDOS = ['Terça', 'Quarta', 'Quinta', 'Sexta'];
  const DIAS_SEMANA_COMPLETO = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];

  const alaInput = document.getElementById('alaInput');
  const estacaInput = document.getElementById('estacaInput');
  const mesSelect = document.getElementById('mesSelect');
  const anoInput = document.getElementById('anoInput');
  const diasContainer = document.getElementById('diasContainer');
  const mesAnoTitulo = document.getElementById('mesAnoTitulo');
  const totalDiasLabel = document.getElementById('totalDiasLabel');
  const statusLabel = document.getElementById('statusLabel');
  const fileInput = document.getElementById('fileInput');
  const calHost = document.getElementById('calendarioImagemHost');

  // estado.dias[dia] = { pessoas: [ {nome:'', repetir:false}, ... ] }
  let estado = { ala: '', estaca: '', ano: 2026, mes: 9, dias: {} };
  let temAlteracoesNaoSalvas = false;
  let canvasGerado = null;

  alaInput.addEventListener('input', () => {
    estado.ala = alaInput.value;
    marcarAlterado();
  });
  estacaInput.addEventListener('input', () => {
    estado.estaca = estacaInput.value;
    marcarAlterado();
  });

  MESES.forEach((nome, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1;
    opt.textContent = nome;
    mesSelect.appendChild(opt);
  });

  function diasNoMes(ano, mes){ return new Date(ano, mes, 0).getDate(); }

  function novaPessoa(){ return { nome: '', repetir: false }; }
  function novoDia(){ return { pessoas: [ novaPessoa() ] }; }

  // Copia os dados de uma pessoa para o mesmo índice em todos os dias do mês
  // que caem no mesmo dia da semana (ex.: repetir toda terça-feira).
  function propagarPessoa(pessoaIdx, dadosPessoa, diaSemanaNum){
    const total = diasNoMes(estado.ano, estado.mes);
    for(let d = 1; d <= total; d++){
      const dow = new Date(estado.ano, estado.mes - 1, d).getDay();
      if(dow !== diaSemanaNum) continue;
      const key = String(d);
      if(!estado.dias[key]) estado.dias[key] = novoDia();
      const pessoasDia = estado.dias[key].pessoas;
      while(pessoasDia.length <= pessoaIdx) pessoasDia.push(novaPessoa());
      pessoasDia[pessoaIdx] = {
        nome: dadosPessoa.nome,
        repetir: true
      };
    }
  }

  function marcarAlterado(){
    temAlteracoesNaoSalvas = true;
    statusLabel.textContent = 'Há alterações não salvas.';
    invalidarImagem();
  }
  function marcarSalvo(){
    temAlteracoesNaoSalvas = false;
    statusLabel.textContent = 'Tudo salvo.';
  }
  function confirmarDescarte(){
    if(!temAlteracoesNaoSalvas) return true;
    return window.confirm('Existem alterações não salvas. Deseja continuar mesmo assim?');
  }
  function invalidarImagem(){
    canvasGerado = null;
    document.getElementById('btnBaixarImagem').disabled = true;
    document.getElementById('btnCompartilharImagem').disabled = true;
    document.getElementById('imagePreviewWrap').style.display = 'none';
    document.getElementById('imageStatus').textContent = 'A imagem foi alterada desde a última geração — gere novamente antes de baixar ou compartilhar.';
  }

  // ---------- Renderização da lista de dias (edição) ----------
  function renderizarCalendario(){
    const { ano, mes, dias } = estado;
    const total = diasNoMes(ano, mes);
    mesAnoTitulo.textContent = `${MESES[mes-1]} de ${ano}`;
    diasContainer.innerHTML = '';

    let diasExibidos = 0;

    for(let d = 1; d <= total; d++){
      const dataObj = new Date(ano, mes - 1, d);
      if(!DIAS_PERMITIDOS.includes(dataObj.getDay())) continue; // pula segunda, sábado e domingo
      diasExibidos++;

      const key = String(d);
      if(!dias[key]) dias[key] = novoDia();
      const dadosDia = dias[key];
      if(!Array.isArray(dadosDia.pessoas)) dadosDia.pessoas = [];

      const diaSemana = DIAS_SEMANA[dataObj.getDay()];

      const card = document.createElement('div');
      card.className = 'day-card';

      const dateCol = document.createElement('div');
      dateCol.className = 'day-date';
      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = String(d).padStart(2, '0');
      const weekdayEl = document.createElement('div');
      weekdayEl.className = 'day-weekday';
      weekdayEl.textContent = diaSemana;
      dateCol.appendChild(numEl);
      dateCol.appendChild(weekdayEl);

      const infoCol = document.createElement('div');
      infoCol.className = 'day-info';

      function renderPessoas(){
        infoCol.innerHTML = '';

        dadosDia.pessoas.forEach((pessoa, pessoaIdx) => {
          const bloco = document.createElement('div');
          bloco.className = 'pessoa-block';

          const header = document.createElement('div');
          header.className = 'pessoa-header';
          const label = document.createElement('span');
          label.textContent = `Pessoa ${pessoaIdx + 1}`;
          header.appendChild(label);

          const repetirLabel = document.createElement('label');
          repetirLabel.className = 'repetir-label';
          const repetirCheckbox = document.createElement('input');
          repetirCheckbox.type = 'checkbox';
          repetirCheckbox.checked = !!pessoa.repetir;
          repetirLabel.appendChild(repetirCheckbox);
          repetirLabel.appendChild(document.createTextNode(
            `Repetir sempre toda ${DIAS_SEMANA_COMPLETO[dataObj.getDay()]}`
          ));
          repetirCheckbox.addEventListener('change', () => {
            pessoa.repetir = repetirCheckbox.checked;
            marcarAlterado();
            if(pessoa.repetir){
              propagarPessoa(pessoaIdx, pessoa, dataObj.getDay());
              renderizarCalendario();
            }
          });
          header.appendChild(repetirLabel);

          const removerBtn = document.createElement('button');
          removerBtn.type = 'button';
          removerBtn.className = 'btn-remove-pessoa';
          removerBtn.textContent = 'Remover pessoa';
          removerBtn.addEventListener('click', () => {
            dadosDia.pessoas.splice(pessoaIdx, 1);
            renderPessoas();
            marcarAlterado();
          });
          header.appendChild(removerBtn);

          bloco.appendChild(header);

          const nomeGroup = document.createElement('div');
          nomeGroup.className = 'field-group';
          const nomeLabel = document.createElement('label');
          nomeLabel.textContent = 'Nome da pessoa';
          const nomeInput = document.createElement('input');
          nomeInput.type = 'text';
          nomeInput.className = 'nome-input';
          nomeInput.placeholder = 'Nome de quem vai apoiar a aula';
          nomeInput.value = pessoa.nome;
          nomeInput.addEventListener('input', () => {
            pessoa.nome = nomeInput.value;
            marcarAlterado();
          });
          nomeInput.addEventListener('blur', () => {
            if(pessoa.repetir){
              propagarPessoa(pessoaIdx, pessoa, dataObj.getDay());
              renderizarCalendario();
            }
          });
          nomeGroup.appendChild(nomeLabel);
          nomeGroup.appendChild(nomeInput);
          bloco.appendChild(nomeGroup);

          infoCol.appendChild(bloco);
        });

        const addPessoaBtn = document.createElement('button');
        addPessoaBtn.type = 'button';
        addPessoaBtn.className = 'btn-add-pessoa';
        addPessoaBtn.textContent = dadosDia.pessoas.length === 0 ? 'Adicionar pessoa' : 'Adicionar outra pessoa';
        addPessoaBtn.addEventListener('click', () => {
          dadosDia.pessoas.push(novaPessoa());
          renderPessoas();
          marcarAlterado();
        });
        infoCol.appendChild(addPessoaBtn);
      }
      renderPessoas();

      card.appendChild(dateCol);
      card.appendChild(infoCol);
      diasContainer.appendChild(card);
    }

    totalDiasLabel.textContent = `${diasExibidos} dias de terça a sexta`;
  }

  function definirMesAno(ano, mes, dias, ala, estaca){
    estado = {
      ala: ala !== undefined ? ala : estado.ala,
      estaca: estaca !== undefined ? estaca : estado.estaca,
      ano, mes, dias: dias || {}
    };
    alaInput.value = estado.ala;
    estacaInput.value = estado.estaca;
    mesSelect.value = mes;
    anoInput.value = ano;
    renderizarCalendario();
    invalidarImagem();
    document.getElementById('imageStatus').textContent = '';
  }

  // ---------- Eventos de mês/ano ----------
  mesSelect.addEventListener('change', () => {
    const novoMes = parseInt(mesSelect.value, 10);
    if(!confirmarDescarte()){ mesSelect.value = estado.mes; return; }
    definirMesAno(estado.ano, novoMes, {});
    marcarSalvo();
    statusLabel.textContent = 'Novo mês carregado. Nada salvo ainda.';
  });

  anoInput.addEventListener('change', () => {
    let novoAno = parseInt(anoInput.value, 10);
    if(isNaN(novoAno) || novoAno < 2000 || novoAno > 2100){ novoAno = estado.ano; }
    if(!confirmarDescarte()){ anoInput.value = estado.ano; return; }
    definirMesAno(novoAno, estado.mes, {});
    marcarSalvo();
    statusLabel.textContent = 'Novo ano carregado. Nada salvo ainda.';
  });

  // ---------- Botão Novo ----------
  document.getElementById('btnNovo').addEventListener('click', () => {
    if(!window.confirm('Criar uma nova lista vai apagar os dados deste mês na tela (o que já foi salvo em arquivo continua seguro). Continuar?')) return;
    const hoje = new Date();
    definirMesAno(hoje.getFullYear(), hoje.getMonth() + 1, {}, estado.ala, estado.estaca);
    marcarSalvo();
    statusLabel.textContent = 'Nova lista criada.';
  });

  // ---------- Botão Salvar ----------
  document.getElementById('btnSalvar').addEventListener('click', () => {
    const payload = {
      tipo: 'gestor-de-presenca-de-apoio-seminario',
      versao: 1,
      ala: estado.ala,
      estaca: estado.estaca,
      ano: estado.ano,
      mes: estado.mes,
      dias: estado.dias
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const mesNome = MESES[estado.mes - 1].toLowerCase();
    a.href = url;
    a.download = `presenca-apoio-${mesNome}-${estado.ano}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    marcarSalvo();
  });

  // ---------- Botão Abrir ----------
  document.getElementById('btnAbrir').addEventListener('click', () => {
    if(!confirmarDescarte()) return;
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const ano = parseInt(data.ano, 10);
        const mes = parseInt(data.mes, 10);
        if(!ano || !mes || mes < 1 || mes > 12){ throw new Error('Arquivo inválido'); }
        const diasCarregados = {};
        if(data.dias && typeof data.dias === 'object'){
          Object.keys(data.dias).forEach(k => {
            const item = data.dias[k];
            if(item && Array.isArray(item.pessoas)){
              diasCarregados[k] = {
                pessoas: item.pessoas.map(p => ({
                  nome: (p && typeof p.nome === 'string') ? p.nome : '',
                  repetir: !!(p && p.repetir)
                }))
              };
            }
          });
        }
        const ala = typeof data.ala === 'string' ? data.ala : '';
        const estaca = typeof data.estaca === 'string' ? data.estaca : '';
        definirMesAno(ano, mes, diasCarregados, ala, estaca);
        marcarSalvo();
        statusLabel.textContent = `Arquivo carregado: ${file.name}`;
      } catch(err){
        window.alert('Não foi possível abrir este arquivo. Verifique se é um arquivo salvo pelo Gestor de Presença de Apoio.');
      }
    };
    reader.readAsText(file);
  });

  window.addEventListener('beforeunload', (e) => {
    if(temAlteracoesNaoSalvas){ e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Geração da imagem (calendário horizontal) ----------
  function montarCalendarioParaImagem(){
    const { ano, mes, dias, ala, estaca } = estado;
    const total = diasNoMes(ano, mes);

    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';

    const header = document.createElement('div');
    header.className = 'cal-header';
    const h2 = document.createElement('h2');
    h2.textContent = `Presença de Apoio — ${MESES[mes-1]} de ${ano}`;
    const span = document.createElement('span');
    const partes = [];
    if(ala) partes.push(`Ala ${ala}`);
    if(estaca) partes.push(`Estaca ${estaca}`);
    span.textContent = partes.length > 0 ? partes.join(' — ') : 'Escala de apoio na sala do seminário';
    header.appendChild(h2);
    header.appendChild(span);
    wrap.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    DIAS_SEMANA_PERMITIDOS.forEach(nome => {
      const wd = document.createElement('div');
      wd.className = 'cal-weekday';
      wd.textContent = nome;
      grid.appendChild(wd);
    });

    const diasValidos = [];
    for(let d = 1; d <= total; d++){
      const dataObj = new Date(ano, mes - 1, d);
      if(DIAS_PERMITIDOS.includes(dataObj.getDay())){
        diasValidos.push({ dia: d, coluna: dataObj.getDay() - 2 });
      }
    }

    const colunaInicial = diasValidos.length > 0 ? diasValidos[0].coluna : 0;
    for(let i = 0; i < colunaInicial; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    diasValidos.forEach(({ dia }) => {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';

      const num = document.createElement('div');
      num.className = 'cal-cell-num';
      num.textContent = String(dia);
      cell.appendChild(num);

      const dadosDia = dias[String(dia)];
      if(dadosDia && Array.isArray(dadosDia.pessoas)){
        dadosDia.pessoas.forEach(pessoa => {
          if(!pessoa.nome) return;
          const pessoaEl = document.createElement('div');
          pessoaEl.className = 'cal-pessoa';
          pessoaEl.textContent = pessoa.nome;
          cell.appendChild(pessoaEl);
        });
      }
      grid.appendChild(cell);
    });

    const totalCelulas = colunaInicial + diasValidos.length;
    const restante = (4 - (totalCelulas % 4)) % 4;
    for(let i = 0; i < restante; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    wrap.appendChild(grid);

    const footer = document.createElement('div');
    footer.className = 'cal-footer';
    footer.textContent = 'Gerado pelo Gestor de Presença de Apoio';
    wrap.appendChild(footer);

    return wrap;
  }

  const btnGerarImagem = document.getElementById('btnGerarImagem');
  const btnBaixarImagem = document.getElementById('btnBaixarImagem');
  const btnCompartilharImagem = document.getElementById('btnCompartilharImagem');
  const imageStatus = document.getElementById('imageStatus');
  const imagePreviewWrap = document.getElementById('imagePreviewWrap');
  const imagePreview = document.getElementById('imagePreview');

  btnGerarImagem.addEventListener('click', () => {
    if(typeof html2canvas === 'undefined'){
      imageStatus.textContent = 'Não foi possível carregar o gerador de imagens. Verifique sua conexão com a internet e tente novamente.';
      return;
    }
    imageStatus.textContent = 'Gerando imagem...';
    btnGerarImagem.disabled = true;

    calHost.innerHTML = '';
    const calendarioEl = montarCalendarioParaImagem();
    calHost.appendChild(calendarioEl);

    html2canvas(calendarioEl, { scale: 2, backgroundColor: '#F3F1EA' }).then(canvas => {
      canvasGerado = canvas;
      imagePreview.src = canvas.toDataURL('image/png');
      imagePreviewWrap.style.display = 'block';
      btnBaixarImagem.disabled = false;
      btnCompartilharImagem.disabled = false;
      imageStatus.textContent = 'Imagem pronta.';
      btnGerarImagem.disabled = false;
      calHost.innerHTML = '';
    }).catch(() => {
      imageStatus.textContent = 'Ocorreu um erro ao gerar a imagem. Tente novamente.';
      btnGerarImagem.disabled = false;
    });
  });

  btnBaixarImagem.addEventListener('click', () => {
    if(!canvasGerado) return;
    const a = document.createElement('a');
    const mesNome = MESES[estado.mes - 1].toLowerCase();
    a.href = canvasGerado.toDataURL('image/png');
    a.download = `presenca-apoio-${mesNome}-${estado.ano}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  btnCompartilharImagem.addEventListener('click', () => {
    if(!canvasGerado) return;
    canvasGerado.toBlob(async (blob) => {
      if(!blob) return;
      const mesNome = MESES[estado.mes - 1].toLowerCase();
      const file = new File([blob], `presenca-apoio-${mesNome}-${estado.ano}.png`, { type: 'image/png' });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({
            files: [file],
            title: 'Presença de Apoio do Seminário',
            text: `Escala de apoio — ${MESES[estado.mes-1]} de ${estado.ano}`
          });
          imageStatus.textContent = 'Compartilhado.';
        }catch(err){
          if(err && err.name !== 'AbortError'){
            imageStatus.textContent = 'Não foi possível compartilhar. A imagem foi baixada — anexe manualmente no WhatsApp.';
            btnBaixarImagem.click();
          }
        }
      } else {
        imageStatus.textContent = 'Este navegador não permite compartilhar a imagem diretamente. A imagem foi baixada — anexe-a manualmente numa conversa do WhatsApp.';
        btnBaixarImagem.click();
        window.open('https://wa.me/', '_blank');
      }
    }, 'image/png');
  });

  // ---------- Inicialização ----------
  definirMesAno(estado.ano, estado.mes, {});
  marcarSalvo();
})();
</script>
